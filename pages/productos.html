<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/img/sbicon.ico">
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <title>Productos | Sabina Accesorios</title>
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav>
      <div class="bar-inner">
        <!-- botón hamburguesa -->
        <button class="hamburger" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <div class="nav-links">
          <!-- Desde /pages/ siempre usamos rutas relativas -->
          <a href="../index.html">Inicio</a>
          <a href="productos.html">Productos</a>
          <a href="contacto.html">Contactos</a>
          <a href="carrito.html" id="nav-cart">🛒 (0)</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO -->
  <main>
    <section id="hero" class="container">
      <img class="logo" src="../assets/img/4.png" alt="Logo Sabina Accesorios">
    </section>

    <!-- Título -->
    <h1 id="productos-titulo">Productos en stock</h1>

    <!-- Filtro por categoría -->
    <section id="filtro" class="container">
      <label for="categoria">Filtrar por categoría:</label>
      <select id="categoria">
        <option value="all">Todas</option>
        <option value="anillos">Anillos</option>
        <option value="aros">Aros</option>
        <option value="carteras">Carteras</option>
        <option value="collares">Collares</option>
      </select>
    </section>

    <!-- Contenedor donde catalogo.js dibuja las cards -->
    <section id="productos" class="container"></section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="bar-inner">
      <p>© 2025 Sabina Accesorios - Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Script principal del catálogo (módulo) -->
  <script type="module" src="../assets/js/catalogo.js"></script>

  <!-- Script: filtro + menú hamburguesa -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Filtro por categoría
      const select = document.getElementById("categoria");
      const contenedor = document.getElementById("productos");

      if (select && contenedor) {
        select.addEventListener("change", () => {
          const categoria = select.value;
          const cards = contenedor.querySelectorAll(".producto");

          cards.forEach(card => {
            const cat = (card.dataset.cat || "").toLowerCase();
            card.style.display =
              categoria === "all" || cat === categoria ? "" : "none";
          });
        });
      }

      // Menú hamburguesa (misma lógica que en index)
      const hamburger = document.querySelector(".hamburger");
      const navLinks = document.querySelector(".nav-links");
      if (hamburger && navLinks) {
        hamburger.addEventListener("click", () => {
          const abierto = navLinks.classList.toggle("active");
          hamburger.setAttribute("aria-expanded", abierto ? "true" : "false");
        });
      }
    });
  </script>

  <!-- SweetAlert2 (para avisar cuando se agrega al carrito) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
